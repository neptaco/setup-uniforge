name: 'Setup UniForge'
description: 'Install UniForge CLI for Unity development'
author: 'neptaco'
branding:
  icon: 'box'
  color: 'purple'

inputs:
  version:
    description: 'UniForge version to install (e.g., "v1.0.0" or "latest")'
    required: false
    default: 'latest'
  ref:
    description: 'Build from source at this ref (branch, tag, or commit SHA). Requires Go to be installed.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Build from source (Linux/macOS)
    - name: Build from source (Linux/macOS)
      if: inputs.ref != '' && runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        REF="${{ inputs.ref }}"

        # Validate ref: allow branch names, tags, and commit SHAs
        if [[ ! "$REF" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
          echo "::error::Invalid ref format: $REF"
          exit 1
        fi

        echo "Building UniForge from ref: $REF"

        # Clone and build
        SRC_DIR="${RUNNER_TEMP:-/tmp}/uniforge-src"
        trap 'rm -rf "$SRC_DIR" 2>/dev/null' EXIT

        # Try shallow clone with branch first, fallback to full clone + checkout
        if ! git clone --depth 1 --branch "$REF" https://github.com/neptaco/uniforge.git "$SRC_DIR" 2>/dev/null; then
          echo "Shallow clone failed, trying full clone with checkout..."
          git clone https://github.com/neptaco/uniforge.git "$SRC_DIR"
          git -C "$SRC_DIR" checkout "$REF"
        fi

        cd "$SRC_DIR"
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "Building version: $VERSION"
        go build -ldflags "-X main.version=$VERSION" -o uniforge .
        sudo mv uniforge /usr/local/bin/
        uniforge --version

    # Build from source (Windows)
    - name: Build from source (Windows)
      if: inputs.ref != '' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $Ref = "${{ inputs.ref }}"

        # Validate ref: allow branch names, tags, and commit SHAs
        if ($Ref -notmatch '^[a-zA-Z0-9._/-]+$') {
          Write-Error "Invalid ref format: $Ref"
          exit 1
        }

        Write-Host "Building UniForge from ref: $Ref"

        # Clone and build
        $TempDir = "$env:RUNNER_TEMP\uniforge-src"
        try {
          # Try shallow clone with branch first, fallback to full clone + checkout
          git clone --depth 1 --branch $Ref https://github.com/neptaco/uniforge.git $TempDir 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Shallow clone failed, trying full clone with checkout..."
            git clone https://github.com/neptaco/uniforge.git $TempDir
            git -C $TempDir checkout $Ref
          }

          Set-Location $TempDir
          $Version = git describe --tags --always --dirty 2>$null
          if (-not $Version) { $Version = "dev" }
          Write-Host "Building version: $Version"
          go build -ldflags "-X main.version=$Version" -o uniforge.exe .

          $InstallDir = "$env:RUNNER_TOOL_CACHE"
          Move-Item -Path "uniforge.exe" -Destination "$InstallDir\uniforge.exe" -Force
          "$InstallDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Set-Location $env:RUNNER_TEMP
          & "$InstallDir\uniforge.exe" --version
        } finally {
          if (Test-Path $TempDir) { Remove-Item -Recurse -Force $TempDir }
        }

    # Download release (Linux/macOS)
    - name: Install UniForge (Linux/macOS)
      if: inputs.ref == '' && runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"

        # Validate version: allow "latest" or semver tags (vX.Y.Z)
        if [[ ! "$VERSION" =~ ^(latest|v[0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
          echo "::error::Invalid version format: $VERSION (expected 'latest' or 'vX.Y.Z')"
          exit 1
        fi

        if [ "$VERSION" = "latest" ]; then
          BASE_URL="https://github.com/neptaco/uniforge/releases/latest/download"
        else
          BASE_URL="https://github.com/neptaco/uniforge/releases/download/${VERSION}"
        fi

        # Determine architecture
        case "${{ runner.arch }}" in
          X64)
            ARCH="amd64"
            ;;
          ARM64)
            ARCH="arm64"
            ;;
          *)
            echo "::error::Unsupported architecture: ${{ runner.arch }}"
            exit 1
            ;;
        esac

        # Determine OS
        case "${{ runner.os }}" in
          Linux)
            URL="${BASE_URL}/UniForge_linux_${ARCH}.tar.gz"
            ;;
          macOS)
            URL="${BASE_URL}/UniForge_darwin_${ARCH}.tar.gz"
            ;;
        esac

        TEMP_DIR="${{ runner.temp }}"
        TEMP_FILE="${TEMP_DIR}/uniforge.tar.gz"
        CHECKSUM_FILE="${TEMP_DIR}/checksums.txt"
        trap 'rm -f "$TEMP_FILE" "$CHECKSUM_FILE" 2>/dev/null' EXIT

        # Download archive and checksums
        curl -fsSL "$URL" -o "$TEMP_FILE"
        curl -fsSL "${BASE_URL}/checksums.txt" -o "$CHECKSUM_FILE"

        # Verify checksum
        ARCHIVE_NAME=$(basename "$URL")
        EXPECTED_CHECKSUM=$(grep "$ARCHIVE_NAME" "$CHECKSUM_FILE" | awk '{print $1}')
        if [ -z "$EXPECTED_CHECKSUM" ]; then
          echo "::error::Checksum not found for $ARCHIVE_NAME"
          exit 1
        fi

        if command -v sha256sum &>/dev/null; then
          ACTUAL_CHECKSUM=$(sha256sum "$TEMP_FILE" | awk '{print $1}')
        else
          ACTUAL_CHECKSUM=$(shasum -a 256 "$TEMP_FILE" | awk '{print $1}')
        fi

        if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
          echo "::error::Checksum mismatch! Expected: $EXPECTED_CHECKSUM, Got: $ACTUAL_CHECKSUM"
          exit 1
        fi
        echo "Checksum verified: $ACTUAL_CHECKSUM"

        tar -xzf "$TEMP_FILE" -C "$TEMP_DIR"
        chmod +x "${{ runner.temp }}/uniforge"
        sudo mv "${{ runner.temp }}/uniforge" /usr/local/bin/
        uniforge --version

    # Download release (Windows)
    - name: Install UniForge (Windows)
      if: inputs.ref == '' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $Version = "${{ inputs.version }}"

        # Validate version: allow "latest" or semver tags (vX.Y.Z)
        if ($Version -notmatch '^(latest|v[0-9]+\.[0-9]+\.[0-9]+.*)$') {
          Write-Error "Invalid version format: $Version (expected 'latest' or 'vX.Y.Z')"
          exit 1
        }

        if ($Version -eq "latest") {
          $BaseUrl = "https://github.com/neptaco/uniforge/releases/latest/download"
        } else {
          $BaseUrl = "https://github.com/neptaco/uniforge/releases/download/$Version"
        }

        # Windows only supports amd64
        $Arch = "${{ runner.arch }}"
        if ($Arch -eq "ARM64") {
          Write-Error "Windows ARM64 is not supported"
          exit 1
        }

        $ArchiveName = "UniForge_windows_amd64.tar.gz"
        $Url = "$BaseUrl/$ArchiveName"
        $TempFile = "$env:RUNNER_TEMP\uniforge.tar.gz"
        $ChecksumFile = "$env:RUNNER_TEMP\checksums.txt"

        Write-Host "Downloading from: $Url"
        try {
          # Download archive and checksums
          Invoke-WebRequest -Uri $Url -OutFile $TempFile
          Invoke-WebRequest -Uri "$BaseUrl/checksums.txt" -OutFile $ChecksumFile

          # Verify checksum
          $ChecksumContent = Get-Content $ChecksumFile
          $ExpectedLine = $ChecksumContent | Where-Object { $_ -match $ArchiveName }
          if (-not $ExpectedLine) {
            Write-Error "Checksum not found for $ArchiveName"
            exit 1
          }
          $ExpectedChecksum = ($ExpectedLine -split '\s+')[0]
          $ActualChecksum = (Get-FileHash -Path $TempFile -Algorithm SHA256).Hash.ToLower()

          if ($ExpectedChecksum -ne $ActualChecksum) {
            Write-Error "Checksum mismatch! Expected: $ExpectedChecksum, Got: $ActualChecksum"
            exit 1
          }
          Write-Host "Checksum verified: $ActualChecksum"

          tar -xzf $TempFile -C $env:RUNNER_TEMP

          # Add to PATH
          $InstallDir = "$env:RUNNER_TOOL_CACHE"
          Move-Item -Path "$env:RUNNER_TEMP\uniforge.exe" -Destination "$InstallDir\uniforge.exe" -Force
          "$InstallDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Verify
          & "$InstallDir\uniforge.exe" --version
        } finally {
          if (Test-Path $TempFile) { Remove-Item $TempFile -Force }
          if (Test-Path $ChecksumFile) { Remove-Item $ChecksumFile -Force }
        }
